name: report

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install test dependencies
        run: python -m pip install capstone==5.0.7
      - name: Generate progress audit
        run: python tools/audit_progress.py
      - name: Generate progress report
        run: python tools/gen_report.py
      - name: Test progress report policy
        run: python -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: YKGP_report
          path: build/report.json
      - name: Upload progress audit
        uses: actions/upload-artifact@v4
        with:
          name: YKGP_progress_audit
          path: |
            build/progress_audit.json
            build/progress_audit.md
            build/report_c.json
